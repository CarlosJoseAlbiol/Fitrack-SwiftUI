# .github/workflows/build.yml
name: Build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Fitrack.xcodeproj.zip
      - run: xcodebuild -list -project Fitrack.xcodeproj
      - run: xcodebuild -project Fitrack.xcodeproj -scheme Fitrack -destination 'platform=iOS Simulator,name=iPhone 17' build
